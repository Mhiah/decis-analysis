name: Research refresh

on:
  schedule:
    # Every 3 hours — SEC + Bitget enrichment for new Item 2.02 events
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh research packages
        env:
          IAA_SEC_USER_AGENT: ${{ secrets.IAA_SEC_USER_AGENT }}
          PYTHONPATH: research
        run: |
          export IAA_SEC_USER_AGENT="${IAA_SEC_USER_AGENT:-IAA-Research/0.1 iaa.contact2026@gmail.com}"
          python research/refresh_research.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "decis-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            decis-ui/public/desk_snapshot.json \
            data/desk_snapshot.json \
            research/data/events_live.jsonl \
            research/data/event_scores_live.jsonl \
            research/data/replay_live.json \
            research/data/*.csv \
            research/reports || true
          if git diff --staged --quiet; then
            echo "No research changes to commit."
          else
            git commit -m "chore: refresh desk research snapshot"
            git push
          fi
