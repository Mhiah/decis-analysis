name: Research refresh

on:
  schedule:
    # Every 3 hours — SEC + Bitget enrichment for new Item 2.02 events
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh research packages
        env:
          IAA_SEC_USER_AGENT: ${{ secrets.IAA_SEC_USER_AGENT }}
          PYTHONPATH: research
        run: |
          export IAA_SEC_USER_AGENT="${IAA_SEC_USER_AGENT:-IAA-Research/0.1 iaa.contact2026@gmail.com}"
          python research/refresh_research.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "decis-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage whole paths: a glob that matches nothing (e.g. research/data/*.csv
          # before any candles exist) makes `git add` abort and stage nothing.
          git add research/data decis-ui/public/desk_snapshot.json data/desk_snapshot.json
          # The snapshot's updatedAt changes every run; only ship when research data moved.
          if git diff --staged --quiet -- research/data; then
            echo "No new research data to commit."
          else
            git commit -m "chore: refresh desk research snapshot"
            git push
          fi
