name: Research refresh

on:
  schedule:
    # Every 3 hours — SEC + Bitget enrichment for new Item 2.02 events
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh research packages
        env:
          IAA_SEC_USER_AGENT: ${{ secrets.IAA_SEC_USER_AGENT }}
          PYTHONPATH: research
        run: |
          export IAA_SEC_USER_AGENT="${IAA_SEC_USER_AGENT:-IAA-Research/0.1 iaa.contact2026@gmail.com}"
          python research/refresh_research.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "decis-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage whole paths: a glob that matches nothing (e.g. research/data/*.csv
          # before any candles exist) makes `git add` abort and stage nothing.
          git add research/data decis-ui/public/desk_snapshot.json data/desk_snapshot.json

          # The snapshot's updatedAt changes every run, so ignore it when deciding
          # whether anything real changed. Research data or snapshot content counts.
          changed=0
          git diff --staged --quiet -- research/data || changed=1
          for f in data/desk_snapshot.json decis-ui/public/desk_snapshot.json; do
            if ! git show "HEAD:$f" 2>/dev/null | jq -S 'del(.updatedAt)' > /tmp/old.json \
               || ! jq -S 'del(.updatedAt)' "$f" | cmp -s - /tmp/old.json; then
              changed=1
            fi
          done

          if [ "$changed" = 0 ]; then
            echo "No research changes to commit."
          else
            git add research/reports
            git commit -m "chore: refresh desk research snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
